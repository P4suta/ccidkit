name = "ccidkit"
summary = "Access smart cards through USB CCID, PC/SC, and virtual readers in Rust"
install = """
git clone https://github.com/P4suta/ccidkit.git
cd ccidkit
mise trust
mise install
"""
usage_language = "sh"
usage = "mise x -- cargo run --locked -p ccid-cli -- --help"
documentation_index = true
copyright = "2026 ccidkit contributors"
license = "MIT OR Apache-2.0"

