# Weekly Cargo and GitHub Actions updates. Every commit is prefixed `build(deps)`;
# patch/minor updates are grouped while majors remain isolated for deliberate review.
# `just deps` still rejects a dependency that crosses the one-library workspace policy,
# and every action reference remains SHA-pinned after Dependabot changes it.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
    groups:
      cargo-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      github-actions:
        patterns: ["*"]
