# CodeQL security analysis (Advanced Setup). Scans the Rust source and the repository's own
# GitHub Actions workflows, uploading results to Security > Code scanning. Advanced (not
# Default) setup keeps the language set, query suite, and SHA-pinned action versions in-repo
# under the same review as the code, matching this repo's "pin every action" convention.
#
# This stack parses bytes produced by other people's firmware. Every length that decides
# how much work a parse does — `dwLength` in a CCID message, the interface-byte chain of
# an ATR, a descriptor's claimed extent — is read out of the device's own answer, and a
# reader that misbehaves is normal enough here to have a quirk table. The interesting
# findings concern allocation sizing, offset arithmetic, and trusting a claimed length
# over a received one.
#
# Languages:
#   - rust    the stack crates (build-mode: none — the only mode the Rust analysis
#             supports; it resolves the cargo workspace without a traced build).
#   - actions the workflows under .github/workflows (catches injection, unsafe checkout,
#             and token-scope issues in the CI YAML).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan (Mon 03:27 UTC) so newly-published CodeQL queries run against
    # unchanged code, not only on new commits.
    - cron: "27 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # upload the SARIF results to code scanning
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Broader security rule set than the default suite.
          queries: security-extended
      - name: analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v3
        with:
          category: "/language:${{ matrix.language }}"
