---
# SPDX-FileCopyrightText: 2026 ccidkit contributors
#
# SPDX-License-Identifier: MIT OR Apache-2.0

name: CI

"on":
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  MISE_AUTO_INSTALL: "false"
  REQUIRED_GATE: |
    def gate:
      type == "object"
      and ((keys | sort) == ["changes", "check"])
      and all(.[]; type == "object")
      and .changes.result == "success"
      and (.changes.outputs | type == "object")
      and (.changes.outputs.runtime as $runtime
        | ($runtime == "true" or $runtime == "false")
        and (.check.result == (if $runtime == "true" then "success" else "skipped" end)));

jobs:
  changes:
    name: Workflow and repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runtime: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.paths.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: paths
        with:
          base: ${{ github.event.merge_group.base_sha || github.event.repository.default_branch }}
          filters: .github/filters/ci.yml
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026  # v2.85.11
        with:
          tool: mise@2026.10.14
      - run: |
          mise trust
          mise install rust just taplo typos uv actionlint zizmor jq yq
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: mise x -- just fmt-check toml-check typos purity deps unsafe-boundary quirkdb bin-name reuse actionlint zizmor
      - run: mise x -- cargo test --locked -p xtask
      - name: Verify the required gate
        run: |
          checks=$(cat <<'JQ'
            def sample($selector; $states):
              {changes: {result: $states[0], outputs: {runtime: $selector}},
               check: {result: $states[1]}};
            [sample("true"; ["success", "success"]),
             sample("false"; ["success", "skipped"])] as $valid
            | ["true", "false", null, "", "unknown", true, false] as $selectors
            | ["success", "failure", "cancelled", "skipped", null, "", "unknown"] as $states
            | [$selectors[] as $selector
               | $states[] as $changes
               | $states[] as $check
               | sample($selector; [$changes, $check])
               | . as $candidate
               | (gate) == ($valid | any(.[]; . == $candidate))] as $checks
            | [null, [], {}, ($valid[0] | del(.check)),
               ($valid[0] | del(.changes.outputs)),
               ($valid[0] | .changes.outputs = []),
               ($valid[0] | .check = "invalid")] as $invalid
            | if (($checks | length) == 343 and all($checks[]; .)
                  and all($invalid[]; gate | not))
              then {checked: 350}
              else false
              end
          JQ
          )
          mise x -- jq --null-input --exit-status "${REQUIRED_GATE}${checks}"
      - name: Every job contributes to the required gate
        run: |
          mise x -- yq -o=json .github/workflows/ci.yml |
            mise x -- jq --exit-status '(.jobs.required.needs | sort) == (.jobs | keys - ["required"] | sort)'

  check:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libpcsclite-dev
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026  # v2.85.11
        with:
          tool: mise@2026.10.14
      - run: |
          mise trust
          mise install rust just cargo-binstall cargo:cargo-nextest
      - if: runner.os == 'Linux'
        run: mise install cargo:cargo-hack cargo:cargo-msrv cargo:cargo-deny cargo:cargo-shear
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: mise x -- just test-ci
      - if: runner.os == 'Linux'
        run: mise x -- just lint feature-matrix doc deny shear
      - if: runner.os == 'Linux'
        env:
          RUSTFLAGS: ""
        run: mise x -- just msrv

  required:
    name: required
    if: always()
    needs: [changes, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026  # v2.85.11
        with:
          tool: mise@2026.10.14
      - run: |
          mise trust
          mise install jq
      - name: Require every selected job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: mise x -- jq --exit-status "${REQUIRED_GATE} gate" <<< "${NEEDS}"
