# Install tools with `mise install`.
# CI uses these same versions; rust-toolchain.toml also names the Rust version.

[tools]
rust = { version = "1.99.1", profile = "minimal", components = [
  "rustfmt",
  "clippy",
] }

lefthook = "2.1.9"
committed = "1.1.11"
just = "1.50.0"

typos = "1.48.0"
taplo = "0.10.0"
actionlint = "1.7.12"
jq = "1.8.2"
yq = "4.54.1"
zizmor = "1.28.0"

# REUSE runs through uvx.
uv = "0.11.32"

cargo-binstall = "1.21.1"

"cargo:cargo-msrv" = "0.19.3"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-hack" = "0.6.45"
"cargo:cargo-nextest" = "0.9.140"
"cargo:cargo-shear" = "1.13.3"

[settings.cargo]
binstall = true

[tasks.hooks]
description = "Install the git hooks (see lefthook.yml)"
run = "lefthook install"
