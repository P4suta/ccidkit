# The reader quirk table (docs/adr/0009). Validated by `just quirkdb`.
#
# One entry per misbehaving reader model:
#
#   [[reader]]
#   vid = 0x08e6                 # USB vendor id
#   pid = 0x3437                 # USB product id
#   name = "Vendor Model 123"    # the marketing name, for humans and diagnostics
#   flags = ["bogus-descriptor"] # from the vocabulary in xtask/src/quirkdb.rs
#
#   [reader.provenance]
#   source = "cassette"                          # cassette | issue | capture
#   evidence = "cassettes/gemalto-3437-atr.toml" # the file or issue URL that reproduces it
#   date = "2026-08-11"                          # when the reproduction was made
#
# Rules the gate enforces mechanically: entries are sorted ascending by (vid, pid); no
# (vid, pid) appears twice; every entry carries a full provenance; every flag is in the
# vocabulary. An entry without a reproduction of our own does not go in — libccid's
# Info.plist may be consulted to confirm a suspicion, never bulk-transcribed
# (docs/adr/0009).
#
# The table is empty at bootstrap. That is the point: it grows one reproduced entry at a
# time, and the gate runs green over zero entries so the schema is enforced from the
# first entry rather than retrofitted.
