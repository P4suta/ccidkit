# Keep local and CI execution on the version whose configuration is validated
# below. Newer compatible releases remain usable because this is a minimum.
nextest-version = "0.9.140"

[profile.default]
# A failure must remain visible. If a narrow override ever adds retries, a
# pass-after-retry is still a failing result rather than hidden flakiness.
retries = 0
flaky-result = "fail"

# A T=1 retransmission dance against the virtual backend is legitimately slow; an
# exchange that never returns is not. Report at thirty seconds and terminate a
# genuinely stuck test — `wait_for_card` cancellation bugs look exactly like this.
slow-timeout = { period = "30s", terminate-after = 6, grace-period = "10s" }

[profile.ci]
inherits = "default"
# Finish the profile so one failure does not hide independent regressions.
fail-fast = false
