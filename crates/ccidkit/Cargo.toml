[package]
name = "ccidkit"
description = "One-door Rust smart card stack: native CCID, PC/SC coexistence, and deterministic virtual readers"
keywords = ["smartcard", "ccid", "pcsc", "apdu", "reader"]
categories = ["hardware-support", "authentication", "api-bindings"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
build = "build.rs"

[features]
# Platform defaults need no feature: native USB on Linux and PC/SC on Windows/macOS.
# Features only add the non-default backend for a platform, and are always additive.
default = []
pcsc = ["dep:pcsc"]
native-usb = ["dep:nusb"]

[dependencies]

[target.'cfg(target_os = "linux")'.dependencies]
nusb = "0.2.7"
pcsc = { version = "2.9.0", optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
pcsc = "2.9.0"

[target.'cfg(target_os = "windows")'.dependencies]
nusb = { version = "0.2.7", optional = true }

[lints]
workspace = true
