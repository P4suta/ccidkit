[package]
name = "ccid-cli"
description = "Command-line tool to list readers, read ATRs, and exchange APDUs"
keywords = ["smartcard", "ccid", "cli", "apdu", "atr"]
categories = ["command-line-utilities", "hardware-support"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# The facade crate is `ccidkit` and this binary is `ccid`. They must never share a name:
# parallel rustdoc fights over `target/doc/<name>` and `cargo doc` dies (docs/adr/0015).
[[bin]]
name = "ccid"
path = "src/main.rs"

[dependencies]
ccidkit = { path = "../ccidkit", version = "=0.0.0" }

[lints]
workspace = true
