[package]
name = "ccid-driverkit"
description = "Reader bring-up and diagnosis tool for the ccidkit workspace"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# The binary is `ccdev`, not the package name: no bin target may share a name with any
# lib crate (docs/adr/0015, `just bin-name`).
[[bin]]
name = "ccdev"
path = "src/main.rs"

# The driver tool deliberately proves the stable diagnostics surface is sufficient; it
# does not reach into private protocol or backend implementation modules.
[dependencies]
ccidkit = { path = "../ccidkit", version = "=0.0.0" }

[lints]
workspace = true
