# Publishing is a deliberate post-hardware-validation decision. In particular, merging
# code must not accidentally freeze the compact public surface as 0.1.

[workspace]
dependencies_update = false
release_always = false
publish = false
semver_check = false
git_tag_enable = false
git_release_enable = false
changelog_update = false

# The only published library and changelog carrier.
[[package]]
name = "ccidkit"
version_group = "ccidkit"
changelog_update = true
changelog_path = "./CHANGELOG.md"
changelog_include = ["ccid-cli"]
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_draft = true

# Binary package; it adds no library surface.
[[package]]
name = "ccid-cli"
version_group = "ccidkit"

# Unpublished but kept on the same internal version while it lives in the workspace.
[[package]]
name = "ccid-driverkit"
version_group = "ccidkit"
