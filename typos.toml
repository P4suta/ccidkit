# typos — strict spell check across the repo, run by the CI `typos` job (crate-ci/typos)
# and the pre-commit hook. Fix typos rather than suppress them.
#
# `locale = "en-us"` is not negotiable and there is no allowlist for spellings. Write
# "-or" not "-our", "-ize" not "-ise". Only a quoted specification title keeps the
# original spelling.
#
# `[default.extend-words]` is absent because nothing has needed it. An entry is legitimate
# only when it is a name the domain chose — a field the CCID specification spells, a
# reader's marketing name — not a word this project misspelled.

[default]
locale = "en-us"

[files]
extend-exclude = [
  "target/**",
  # Local cargo-mutants reports contain compiler invocations, not project prose.
  "mutants.out/**",
  "**/*.lock",
  # Machine-generated by release-plz from commit subjects; short SHAs split into
  # subtokens and get flagged. The source is reviewed at commit time.
  "CHANGELOG.md",
]

# Captured USB traffic is bytes, not prose. Cassettes themselves are hex-in-TOML
# (docs/adr/0010) and stay checked; only raw captures are exempt.
[type.capture]
extend-glob = ["*.pcapng", "*.pcap", "*.bin"]
check-file = false

[type.toml]
extend-glob = ["*.toml"]

[type.rust]
extend-glob = ["*.rs"]
