[workspace]
resolver = "3"
members = [
  "crates/ccidkit",
  "crates/ccid-cli",
  "crates/ccid-driverkit",
  "xtask",
]
# cargo-fuzz requires nightly and a sanitizer runtime.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Floor imposed by edition 2024.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Yasunobu Sakashita <crates.tank733@slmails.com>"]
repository = "https://github.com/P4suta/ccidkit"
homepage = "https://github.com/P4suta/ccidkit"

# `ccidkit` is the only published library. The CLI may name only the library, and the
# maintainer tools may name the library plus tool-only dependencies. The implementation
# architecture lives inside the library and is enforced by `just purity`.

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Production code must not use unwrap, expect, panic, or unreachable fallbacks.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
# Every message length, slot count, ATR byte count, and `dwLength` field comes from the
# device being spoken to. Arithmetic on those numbers must state what it does on overflow.
arithmetic_side_effects = "warn"
# Index and slice panics are the classic parser vulnerability; model, CCID, and T=1
# modules parse bytes a reader produced.
indexing_slicing = "warn"
missing_errors_doc = "allow"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# The library additionally carries `forbid(unsafe_code)`; this lint protects any future
# workspace target that forgets to opt into the same crate-level rule.
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
